```yaml
name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================================
  # AUTO FIX
  #
  # Runs only once on Ubuntu.
  #
  # Responsibilities:
  #   1. Detect package-lock.json mismatch
  #   2. Regenerate package-lock.json
  #   3. Detect formatting problems
  #   4. Run npm run format
  #   5. Verify formatting
  #   6. Commit and push fixes
  #
  # This job MUST NOT run for fork pull requests because it requires
  # contents: write.
  # ==========================================================================

  auto-fix:
    name: Auto Fix Dependencies and Formatting
    runs-on: ubuntu-latest

    if: >
      github.event_name == 'push' ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository
      )

    permissions:
      contents: write

    steps:
      # ----------------------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------------------

      - name: Checkout source code
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      # ----------------------------------------------------------------------
      # Node.js
      # ----------------------------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ----------------------------------------------------------------------
      # Project setup
      # ----------------------------------------------------------------------

      - name: Setup script
        run: |
          set -euo pipefail

          if [ -f "./setup.sh" ]; then
            chmod +x ./setup.sh
            ./setup.sh
          fi

      # ======================================================================
      # DEPENDENCY CHECK / AUTO FIX
      # ======================================================================

      - name: Check npm ci
        id: npm-ci
        run: |
          set +e

          npm ci 2>&1 | tee npm-ci.log
          status=${PIPESTATUS[0]}

          if [ "$status" -eq 0 ]; then
            echo "needs_fix=false" >> "$GITHUB_OUTPUT"
            echo "npm ci passed."
            exit 0
          fi

          if grep -q "npm error code EUSAGE" npm-ci.log &&
             grep -q "package.json and package-lock.json" npm-ci.log; then

            echo "needs_fix=true" >> "$GITHUB_OUTPUT"

            echo "::warning::package.json and package-lock.json are out of sync."

            exit 0
          fi

          echo "::error::npm ci failed for a reason other than a lockfile mismatch."

          exit "$status"

      - name: Update package-lock.json
        if: steps.npm-ci.outputs.needs_fix == 'true'
        run: |
          set -euo pipefail

          echo "Updating package-lock.json..."

          npm install \
            --package-lock-only \
            --ignore-scripts

          echo "Verifying package-lock.json..."

          npm ci

      # ======================================================================
      # FORMAT SCRIPT DETECTION
      # ======================================================================

      - name: Detect formatting scripts
        id: format-script
        run: |
          set -euo pipefail

          has_format=false
          has_format_check=false

          if node -e "
            const pkg = require('./package.json');
            process.exit(pkg.scripts?.format ? 0 : 1);
          "; then
            has_format=true
          fi

          if node -e "
            const pkg = require('./package.json');
            process.exit(pkg.scripts?.['format-check'] ? 0 : 1);
          "; then
            has_format_check=true
          fi

          echo "has_format=$has_format" >> "$GITHUB_OUTPUT"
          echo "has_format_check=$has_format_check" >> "$GITHUB_OUTPUT"

          echo "format script: $has_format"
          echo "format-check script: $has_format_check"

      # ======================================================================
      # FORMAT CHECK
      # ======================================================================

      - name: Check formatting
        id: format-check
        if: steps.format-script.outputs.has_format_check == 'true'
        continue-on-error: true
        run: |
          set +e

          npm run format-check 2>&1 | tee npm-format.log
          status=${PIPESTATUS[0]}

          if [ "$status" -eq 0 ]; then
            echo "format_failed=false" >> "$GITHUB_OUTPUT"
            echo "Formatting check passed."
          else
            echo "format_failed=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Formatting check failed."
          fi

          exit 0

      # ======================================================================
      # FORMAT AUTO FIX
      # ======================================================================

      - name: Auto-fix formatting
        if: >
          steps.format-check.outputs.format_failed == 'true' &&
          steps.format-script.outputs.has_format == 'true'
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Formatting issues detected"
          echo "=========================================="

          echo "Running npm run format..."

          npm run format

          echo
          echo "Checking for formatter changes..."

          git status --short

          echo
          echo "Verifying formatting..."

          npm run format-check

      # ======================================================================
      # FORMAT FIX FAILURE
      # ======================================================================

      - name: Fail when formatting cannot be auto-fixed
        if: >
          steps.format-check.outputs.format_failed == 'true' &&
          steps.format-script.outputs.has_format != 'true'
        run: |
          echo "::error::Formatting check failed, but package.json has no 'format' script."
          echo "::error::Add a 'format' script to package.json."
          exit 1

      # ======================================================================
      # FINAL FORMAT VERIFICATION
      #
      # Run one more check after all modifications.
      # ======================================================================

      - name: Final formatting verification
        if: steps.format-script.outputs.has_format_check == 'true'
        run: |
          set -euo pipefail

          echo "Final formatting verification..."

          npm run format-check

      # ======================================================================
      # SHOW CHANGES
      # ======================================================================

      - name: Show auto-fix changes
        id: changes
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No automatic fixes were required."
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

          echo "=========================================="
          echo "Automatic fixes:"
          echo "=========================================="

          git status --short

          echo
          echo "Change summary:"

          git diff --stat

      # ======================================================================
      # COMMIT + PUSH
      # ======================================================================

      - name: Commit and push auto-fixes
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          echo "Files being committed:"

          git diff --cached --name-only

          # --------------------------------------------------------------
          # Determine commit message.
          # --------------------------------------------------------------

          lockfile_changed=false
          format_changed=false

          if git diff --cached --quiet -- package-lock.json; then
            lockfile_changed=false
          else
            lockfile_changed=true
          fi

          if git diff --cached --quiet -- ':!package-lock.json'; then
            format_changed=false
          else
            format_changed=true
          fi

          if [ "$lockfile_changed" = true ] && [ "$format_changed" = true ]; then

            git commit \
              -m "chore: auto-fix CI issues" \
              -m "Synchronize dependencies and formatting."

          elif [ "$lockfile_changed" = true ]; then

            git commit \
              -m "fix: sync package-lock.json" \
              -m "Automatically regenerated by the CI dependency fixer."

          elif [ "$format_changed" = true ]; then

            git commit \
              -m "style: auto-format code" \
              -m "Automatically formatted files detected by CI."

          fi

          echo "Pushing automatic fixes..."

          git push

  # ==========================================================================
  # CROSS-PLATFORM BUILD / TEST
  #
  # This job DOES NOT modify the repository.
  #
  # It only checks the resulting source tree.
  # ==========================================================================

  all:
    name: Cross-platform Build and Test

    needs: auto-fix

    if: >
      always() &&
      (
        needs.auto-fix.result == 'success' ||
        needs.auto-fix.result == 'skipped'
      )

    strategy:
      fail-fast: false

      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      # ----------------------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------------------

      - name: Checkout source code
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      # ----------------------------------------------------------------------
      # Setup
      # ----------------------------------------------------------------------

      - name: Setup script for macOS/Linux
        if: matrix.os != 'windows-latest'
        run: |
          set -euo pipefail

          chmod +x ./setup.sh
          ./setup.sh

      - name: Setup script for Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./setup.ps1

      # ----------------------------------------------------------------------
      # Node.js
      # ----------------------------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ----------------------------------------------------------------------
      # Dependencies
      # ----------------------------------------------------------------------

      - name: Install dependencies
        run: npm ci

      # ----------------------------------------------------------------------
      # Formatting verification only
      #
      # Auto-fixing happens in auto-fix.
      # ----------------------------------------------------------------------

      - name: Check formatting
        run: |
          set -euo pipefail

          if node -e "
            const pkg = require('./package.json');
            process.exit(pkg.scripts?.['format-check'] ? 0 : 1);
          "; then

            npm run format-check

          else

            echo "::warning::No format-check script configured."
            echo "Skipping formatting verification."

          fi

      # ----------------------------------------------------------------------
      # Package
      # ----------------------------------------------------------------------

      - name: Package app
        run: npm run package
        timeout-minutes: 30

      # ----------------------------------------------------------------------
      # Artifacts
      # ----------------------------------------------------------------------

      - name: Upload artifacts
        uses: actions/upload-artifact@v7.0.0
        with:
          name: ${{ matrix.os }}-binary
          path: out
          if-no-files-found: error
```
