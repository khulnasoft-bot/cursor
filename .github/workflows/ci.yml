name: CI

on:
    workflow_dispatch:
    pull_request:
        branches: [main]
    push:
        branches: [main]

# Read by default. The auto-fix job explicitly requests write access.
permissions:
    contents: read

defaults:
    run:
        shell: bash

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    # --------------------------------------------------------------------------
    # Dependency Auto-Fix
    #
    # Detects npm ci EUSAGE caused by package.json/package-lock.json mismatch.
    # Only this single Ubuntu job is allowed to modify and push package-lock.json.
    # --------------------------------------------------------------------------
    auto-fix:
        name: Auto Fix Dependencies
        runs-on: ubuntu-latest

        # Only repository branches can be automatically pushed to.
        # Fork PRs must not receive write access.
        if: >
            github.event_name == 'push' ||
            (
                github.event_name == 'pull_request' &&
                github.event.pull_request.head.repo.full_name == github.repository
            )

        permissions:
            contents: write

        outputs:
            lockfile_changed: ${{ steps.fix.outputs.lockfile_changed }}

        steps:
            - name: Checkout source code
              uses: actions/checkout@v7.0.0
              with:
                  fetch-depth: 0
                  ref: ${{ github.head_ref || github.ref_name }}

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Setup script
              run: |
                  if [ -f "./setup.sh" ]; then
                    chmod +x ./setup.sh
                    ./setup.sh
                  fi

            - name: Check npm ci
              id: npm-ci
              run: |
                  set +e

                  npm ci 2>&1 | tee npm-ci.log
                  status=${PIPESTATUS[0]}

                  if [ "$status" -eq 0 ]; then
                    echo "needs_fix=false" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi

                  # Only auto-fix the known lockfile synchronization error.
                  if grep -q "npm error code EUSAGE" npm-ci.log &&
                     grep -q "package.json and package-lock.json" npm-ci.log; then
                    echo "needs_fix=true" >> "$GITHUB_OUTPUT"
                    echo "::warning::package.json and package-lock.json are out of sync."
                    exit 0
                  fi

                  echo "::error::npm ci failed for a reason other than a lockfile mismatch."
                  exit "$status"

            - name: Update package-lock.json
              id: fix
              if: steps.npm-ci.outputs.needs_fix == 'true'
              run: |
                  set -euo pipefail

                  echo "Updating package-lock.json..."
                  npm install

                  echo "Verifying generated lockfile..."
                  npm ci

                  if git diff --quiet -- package-lock.json; then
                    echo "No package-lock.json changes detected."
                    echo "lockfile_changed=false" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi

                  echo "lockfile_changed=true" >> "$GITHUB_OUTPUT"

            - name: Show lockfile changes
              if: steps.fix.outputs.lockfile_changed == 'true'
              run: |
                  git diff -- package-lock.json

            - name: Commit and push lockfile
              if: steps.fix.outputs.lockfile_changed == 'true'
              run: |
                  set -euo pipefail

                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

                  git add package-lock.json

                  git commit \
                    -m "fix: sync package-lock.json" \
                    -m "Automatically regenerated by the CI dependency fixer."

                  git push

    # --------------------------------------------------------------------------
    # Cross-platform Build and Test
    # --------------------------------------------------------------------------
    all:
        name: Cross-platform Build and Test

        needs: auto-fix

        strategy:
            fail-fast: false
            matrix:
                os:
                    - ubuntu-latest
                    - macos-latest
                    - windows-latest

        runs-on: ${{ matrix.os }}

        steps:
            - name: Checkout source code
              uses: actions/checkout@v7.0.0

            - name: Setup script for macOS/Linux
              if: matrix.os != 'windows-latest'
              run: |
                  chmod +x ./setup.sh
                  ./setup.sh

            - name: Setup script for Windows
              if: matrix.os == 'windows-latest'
              shell: pwsh
              run: ./setup.ps1

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Check formatting
              if: matrix.os != 'windows-latest'
              run: npm run format-check

            - name: Check formatting
              id: format-check
              continue-on-error: true
              run: |
                  set -o pipefail
            
                  npm run format-check 2>&1 | tee npm-format.log
                  status=${PIPESTATUS[0]}
            
                  if [ "$status" -eq 0 ]; then
                      echo "needs_fix=false" >> "$GITHUB_OUTPUT"
                      echo "Formatting check passed."
                  else
                      echo "needs_fix=true" >> "$GITHUB_OUTPUT"
                      echo "::warning::Formatting check failed."
                  fi
            
                  exit 0
            
            - name: Auto-fix formatting
              if: steps.format-check.outputs.needs_fix == 'true'
              run: |
                  set -euo pipefail
            
                  echo "Formatting issues detected."
                  echo "Running npm run format..."
            
                  npm run format
            
                  echo "Verifying formatting..."
                  npm run format-check
            
            - name: Commit formatting changes
              if: steps.format-check.outputs.needs_fix == 'true'
              run: |
                  set -euo pipefail
            
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            
                  git add -A
            
                  if git diff --cached --quiet; then
                      echo "::error::Formatting failed but npm run format produced no changes."
                      exit 1
                  fi
            
                  echo "Formatting changes:"
                  git diff --cached --stat
            
                  git commit -m "style: auto-format code"
            
                  git push
              

            - name: Package app
              run: npm run package
              timeout-minutes: 30

            - name: Upload artifacts
              uses: actions/upload-artifact@v7.0.0
              with:
                  name: ${{ matrix.os }}-binary
                  path: out
                  if-no-files-found: error
