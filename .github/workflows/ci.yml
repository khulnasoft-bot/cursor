name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ========================================================================
  # AUTO FIX
  #
  # Runs only once on Ubuntu. It repairs the lockfile and formatting, then
  # commits the resulting changes for branches in this repository.
  # ========================================================================

  auto-fix:
    name: Auto Fix Dependencies and Formatting
    runs-on: ubuntu-latest

    if: >
      github.event_name == 'push' ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository
      )

    permissions:
      contents: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup script
        run: |
          set -euo pipefail

          if [ -f "./setup.sh" ]; then
            chmod +x ./setup.sh
            ./setup.sh
          fi

      - name: Check npm ci
        id: npm-ci
        run: |
          set +e

          npm ci 2>&1 | tee npm-ci.log
          status=${PIPESTATUS[0]}

          if [ "$status" -eq 0 ]; then
            echo "needs_fix=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if grep -q "npm error code EUSAGE" npm-ci.log &&
             grep -q "package.json and package-lock.json" npm-ci.log; then
            echo "needs_fix=true" >> "$GITHUB_OUTPUT"
            echo "::warning::package.json and package-lock.json are out of sync."
            exit 0
          fi

          echo "::error::npm ci failed for a reason other than a lockfile mismatch."
          exit "$status"

      - name: Update package-lock.json
        if: steps.npm-ci.outputs.needs_fix == 'true'
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts
          npm ci

      - name: Detect formatting scripts
        id: format-script
        run: |
          set -euo pipefail

          has_format=false
          has_format_check=false

          node -e "
            const pkg = require('./package.json');
            process.exit(pkg.scripts?.format ? 0 : 1);
          " && has_format=true || true

          node -e "
            const pkg = require('./package.json');
            process.exit(pkg.scripts?.['format-check'] ? 0 : 1);
          " && has_format_check=true || true

          echo "has_format=$has_format" >> "$GITHUB_OUTPUT"
          echo "has_format_check=$has_format_check" >> "$GITHUB_OUTPUT"

      - name: Check formatting
        id: format-check
        if: steps.format-script.outputs.has_format_check == 'true'
        continue-on-error: true
        run: |
          set +e
          npm run format-check 2>&1 | tee npm-format.log
          status=${PIPESTATUS[0]}

          if [ "$status" -eq 0 ]; then
            echo "format_failed=false" >> "$GITHUB_OUTPUT"
          else
            echo "format_failed=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Formatting check failed."
          fi

          exit 0

      - name: Auto-fix formatting
        if: >
          steps.format-check.outputs.format_failed == 'true' &&
          steps.format-script.outputs.has_format == 'true'
        run: |
          set -euo pipefail

          # Formatting can be non-idempotent when setup scripts or generated
          # files are involved. Retry the write/check pair so the fixer does
          # not stop after leaving a partially formatted tree behind.
          for attempt in 1 2 3; do
            echo "Formatting attempt $attempt/3"
            npm run format

            if npm run format-check; then
              exit 0
            fi
          done

          echo "::error::Formatting is still invalid after three auto-fix attempts."
          exit 1

      - name: Fail when formatting cannot be auto-fixed
        if: >
          steps.format-check.outputs.format_failed == 'true' &&
          steps.format-script.outputs.has_format != 'true'
        run: |
          echo "::error::Formatting check failed, but package.json has no 'format' script."
          exit 1

      - name: Final formatting verification
        if: steps.format-script.outputs.has_format_check == 'true'
        run: npm run format-check

      - name: Exclude workflow files from auto-fix commit
        run: |
          set -euo pipefail

          # GITHUB_TOKEN cannot push changes to .github/workflows. Keep
          # workflow files out of the automated formatter's commit; workflow
          # changes must be reviewed and pushed separately with workflow scope.
          git restore --worktree -- .github/workflows

      - name: Show auto-fix changes
        id: changes
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No automatic fixes were required."
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          git status --short
          git diff --stat

      - name: Commit and push auto-fixes
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          lockfile_changed=false
          format_changed=false

          if ! git diff --cached --quiet -- package-lock.json; then
            lockfile_changed=true
          fi

          if ! git diff --cached --quiet -- ':!package-lock.json'; then
            format_changed=true
          fi

          if [ "$lockfile_changed" = true ] && [ "$format_changed" = true ]; then
            git commit -m "chore: auto-fix CI issues" -m "Synchronize dependencies and formatting."
          elif [ "$lockfile_changed" = true ]; then
            git commit -m "fix: sync package-lock.json" -m "Automatically regenerated by the CI dependency fixer."
          elif [ "$format_changed" = true ]; then
            git commit -m "style: auto-format code" -m "Automatically formatted files detected by CI."
          fi

          git push

  all:
    name: Cross-platform Build and Test
    needs: auto-fix

    if: >
      always() &&
      (
        needs.auto-fix.result == 'success' ||
        needs.auto-fix.result == 'skipped'
      )

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup script for macOS/Linux
        if: matrix.os != 'windows-latest'
        run: |
          set -euo pipefail
          chmod +x ./setup.sh
          ./setup.sh

      - name: Setup script for Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./setup.ps1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: |
          set -euo pipefail

          if node -e "
            const pkg = require('./package.json');
            process.exit(pkg.scripts?.['format-check'] ? 0 : 1);
          "; then
            npm run format-check
          else
            echo "::warning::No format-check script configured."
          fi

      - name: Package app
        run: npm run package
        timeout-minutes: 30

      - name: Upload artifacts
        uses: actions/upload-artifact@v7.0.0
        with:
          name: ${{ matrix.os }}-binary
          path: out
          if-no-files-found: error
